services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - ./docker/config/config.local.neon:/var/www/html/app/config/config.local.neon:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_czech_ci
    environment:
      MYSQL_DATABASE: caloriscms
      MYSQL_USER: caloris
      MYSQL_PASSWORD: caloris
      MYSQL_ROOT_PASSWORD: caloris_root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/001-import-caloriscms.sh:/docker-entrypoint-initdb.d/001-import-caloriscms.sh:ro
      - ./app/model/db_mysql.sql:/docker-entrypoint-initdb.d/db_mysql.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: caloris
      PMA_PASSWORD: caloris
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  reset-admin:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - ./docker/config/config.local.neon:/var/www/html/app/config/config.local.neon:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["reset-admin-password"]
    profiles:
      - tools

volumes:
  db_data:
  composer_vendor:
